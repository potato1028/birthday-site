<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>친구를 위한 웹사이트</title>
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="audio.js" defer></script>
    <script src="events.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
    <!-- scene3에서만 나타나는 바깥쪽 GIF 전용 레이어 -->
    <div id="outerGifLayer" class="outer-gif-layer" aria-hidden="true"></div>
    <main class="main-screen">
        <!-- 첫 시작 화면: 베이지색 배경 + 기본 버튼 하나 -->
        <div id="startScreen" class="start-screen">
            <button id="startButton" type="button">자신 생일 축하받으러 가긔...</button>
        </div>

        <!-- 시작하기를 누른 뒤 이 영역에서 이벤트 진행 -->
        <div id="scene" class="scene" hidden></div>

        <!-- 오답 / 완료 화면의 돌아가기 버튼 -->
        <button id="nextButton" class="next-button" type="button" hidden>
            처음으로 돌아가기
        </button>
    </main>

    <!-- event3의 마지막 사진 연출이 끝난 뒤 나타나는 이미지 버튼 -->
    <!-- 버튼 이미지는 Resource/Ad/one.jpeg, 클릭 시 ad.html 새 창 -->
    <a id="event3AdLink"
       class="event3-ad-link"
       href="ad.html"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="새 창에서 특별 이미지 보기"
       hidden>
        <img src="Resource/Ad/one.png" alt="특별 이미지 보기" />
    </a>
</body>
</html>
